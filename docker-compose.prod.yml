# Production (air-gapped): 3 nodes x 72 cores / 786 GB RAM with a Spark cluster.
# Images and models come from the offline bundle (scripts/offline_bundle.sh -> install_offline.sh);
# nothing here pulls from the internet.
#
#   ./install_offline.sh docker-compose.prod.yml
#
# The AutoEDA container is the Spark *driver*. Executors must
#   * reach the driver (network_mode: host is simplest; driver ports 7078/7079 open),
#   * see AUTOEDA_SPARK_WORK_DIR and the input files at the same path (HDFS or a shared mount),
#   * run Python 3.12 — only the standard library is needed; the autoeda code ships itself.
#     Easiest on an air-gapped standalone cluster: run this same image as the Spark workers
#     (see the commented `spark-worker` service), so versions match exactly.
#   * run the same Spark version as PYSPARK_VERSION used to build the image (default 3.5.3).
#
# An existing Spark cluster on the host is used as it is: this file builds nothing and starts no
# Spark master or worker (the spark-worker service below stays commented out). The image only
# carries the Spark *client* (PySpark + Java) the driver needs. Check the cluster's version with
# `spark-submit --version` and build the image to match:
#   docker build --build-arg WITH_SPARK=1 --build-arg PYSPARK_VERSION=<cluster version> -t autoeda:poc .
# Master, conf, work folder and HDFS can also be changed later on the Settings page (Spark cluster
# and HDFS), which also shows the cluster's workers, cores, memory and running apps.
#
# HDFS files on the host are analysed in place, without copying them into /input:
#   * Spark engine + CSV / TSV / Parquet / ORC / JSON: read by the executors directly (hdfs://...).
#   * anything else (Excel, PDF, XML...) or the local engine: streamed into the app over WebHDFS
#     (AUTOEDA_HDFS_URL) for the run, then removed.
#   Users pick files with "Browse HDFS" on the start page or type an hdfs:// path.
name: autoeda   # fixed project name: same container / volume names wherever it is deployed

services:
  autoeda:
    image: autoeda:poc
    command: ["web"]
    network_mode: host
    environment:
      # Host-network service: the UI/REST binds this port directly. 9444 is already allowed through
      # the firewall and no other service on the host listens on it (check with:
      #   ss -ltnp | grep :9444     and from the client: curl -sI http://<host>:9444/health )
      # Change it here if 9444 is taken; keep it in sync with any firewall rule.
      AUTOEDA_PORT: "9444"
      # Sign-in: the first start creates this administrator (then change the password on the Users
      # page; the variable is ignored once users exist). Unset: a random password is printed to the log.
      AUTOEDA_ADMIN_USER: admin
      AUTOEDA_ADMIN_PASSWORD: ${AUTOEDA_ADMIN_PASSWORD:-}
      AUTOEDA_ENGINE: spark
      # --- the Spark cluster already running on the host ---------------------------------------
      AUTOEDA_SPARK_MASTER: spark://spark-master.internal:7077   # YARN: "yarn" (needs HADOOP_CONF_DIR below)
      AUTOEDA_SPARK_UI: http://spark-master.internal:8080        # resources shown in Settings; YARN: http://<resourcemanager>:8088
      AUTOEDA_SPARK_WORK_DIR: file:///shared/autoeda_work      # or hdfs:///tmp/autoeda
      # --- HDFS on the host ------------------------------------------------------------------------
      HADOOP_CONF_DIR: /etc/hadoop/conf          # core-site.xml / hdfs-site.xml: resolves hdfs://nameservice1
      YARN_CONF_DIR: /etc/hadoop/conf
      AUTOEDA_HDFS_URL: http://namenode.internal:9870          # WebHDFS (NameNode HTTP); HA: the active one or HttpFS :14000
      AUTOEDA_HDFS_ROOT: hdfs://nameservice1                   # fs.defaultFS
      AUTOEDA_HDFS_USER: autoeda                               # simple auth; Kerberos: see the keytab lines below
      # ~3 x 72 cores: 14 executors/node x 5 cores, 48 GB each (+ overhead) leaves room for OS/daemons
      AUTOEDA_SPARK_CONF: >-
        spark.driver.port=7078;spark.blockManager.port=7079;
        spark.executor.cores=5;spark.executor.memory=48g;spark.executor.memoryOverhead=8g;
        spark.cores.max=210;spark.driver.maxResultSize=8g;
        spark.sql.shuffle.partitions=840;spark.default.parallelism=840;
        spark.pyspark.python=python3.12
      # Kerberos-secured cluster: add to AUTOEDA_SPARK_CONF
      #   spark.kerberos.principal=autoeda@REALM;spark.kerberos.keytab=/etc/security/keytabs/autoeda.keytab
      # and mount /etc/krb5.conf and the keytab (volumes below). WebHDFS browsing then needs HttpFS / Knox.
      # local DuckDB engine (Excel / PDF / XML / SQLite, or when chosen in the UI) on one big node
      AUTOEDA_MEMORY_LIMIT: 72GB
      AUTOEDA_THREADS: "16"
      AUTOEDA_MAX_JOBS: "2"
      AUTOEDA_LLM_BATCH: "8"
      AUTOEDA_LLM_TIMEOUT: "600"      # CPU inference: a page image or a long batch can take minutes
      OLLAMA_HOST: http://localhost:11434
      # Mixture-of-experts: 35B parameters, ~3B active per token -> small-model speed on CPU, much
      # better answers, reads images (PDF table layout). qwen3.5:2b (also bundled) stays selectable in the UI.
      OLLAMA_MODEL: qwen3.5:35b-a3b
      # CPU threads for inference, sent as the Ollama model option num_thread with EVERY request.
      # Current Ollama runs llama-server, which ignores OLLAMA_NUM_THREADS and uses one thread per
      # logical core of the container (72 here) -> threads straddle the two sockets and run slower.
      # Use the physical cores of ONE socket (Xeon Gold 6140: 18). 0 = let Ollama decide.
      # Also on Settings -> CPU threads per AI call.
      OLLAMA_NUM_THREAD: "12"
      # Keep the loaded model resident between jobs (22 GB; loading takes minutes). Also sent per request.
      OLLAMA_KEEP_ALIVE: 4h
      AUTOEDA_MEMORY_DIR: /memory
    volumes:
      - /srv/autoeda/data:/data
      - /srv/autoeda/memory:/memory        # learned skills; may be a git clone to sync
      - /srv/datasets:/input:ro
      - /shared/autoeda_work:/shared/autoeda_work
      - /etc/hadoop/conf:/etc/hadoop/conf:ro     # the host's Hadoop client configuration
      # - /etc/krb5.conf:/etc/krb5.conf:ro
      # - /etc/security/keytabs/autoeda.keytab:/etc/security/keytabs/autoeda.keytab:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest      # the tag saved in the bundle
    network_mode: host
    # CPU limits for CPU-only inference. Without OLLAMA_NUM_THREADS, llama.cpp starts one thread per
    # logical core it sees (72 here) and the threads thrash each other's caches across NUMA sockets:
    # 3600% CPU with little throughput. ~1 thread per *physical* core of one socket is the sweet spot
    # for a dense 35B model; MoE (35b-a3b) activates ~3B per token so it scales even less.
    #
    # cpuset must be picked per host: `lscpu -e=CPU,CORE,SOCKET,NODE` and stay inside ONE socket.
    # Check first whether the host already constrains it (systemd AllowedCPUs, cgroup cpuset):
    #   cat /sys/fs/cgroup/cpuset.cpus.effective
    # If the Spark executors really use all 72 cores, reserve a whole socket for Ollama, e.g. "36-71".
    # Remove cpuset entirely if the Spark cluster runs on other hosts and this one is Ollama-only.
    # cpuset needs cgroup v2 (modern kernels). On a host without it Docker rejects the container with
    # "cannot set cpuset: no cgroup v2 support" - comment the line out there and rely on
    # OLLAMA_NUM_THREADS alone (the cpuset only reinforces that limit: llama.cpp creates
    # OLLAMA_NUM_THREADS threads whatever the container sees).
    cpuset: "0-11"
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      # NOTE: current Ollama (llama-server based) does NOT apply this to inference threads; it starts
      # one thread per logical core it sees. The app limits threads per request instead:
      # OLLAMA_NUM_THREAD on the autoeda service (model option num_thread). Keep this only as a
      # sane default for direct `ollama run` use.
      OLLAMA_NUM_THREADS: "12"
      # Model load has its own timeout, separate from the HTTP request: with `ollama run` / `curl`
      # the client gives up first and the load is aborted ("context canceled"). 35B on CPU takes
      # minutes; 15m leaves room. After the first load the model stays resident.
      OLLAMA_LOAD_TIMEOUT: 15m
      OLLAMA_KEEP_ALIVE: 4h          # keep the model loaded between jobs (reloading takes a while)
      # Air-gapped: stop Ollama trying to reach ollama.com for recommendations
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"        # = AUTOEDA_MAX_JOBS
      OLLAMA_MAX_LOADED_MODELS: "2"   # 35b-a3b and 2b side by side (RAM is plentiful)
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # Run on each worker node (same image => same Python / Spark / libraries):
  # spark-worker:
  #   image: autoeda:poc
  #   command: ["spark-worker"]
  #   network_mode: host
  #   environment:
  #     SPARK_MASTER_URL: spark://spark-master.internal:7077
  #     SPARK_WORKER_CORES: "70"
  #     SPARK_WORKER_MEMORY: 700g
  #   volumes:
  #     - /srv/datasets:/input:ro
  #     - /shared/autoeda_work:/shared/autoeda_work

volumes:
  ollama:
    # fixed name: the offline installer creates it and preloads the models into it, so it is external
    name: autoeda_ollama
    external: true
