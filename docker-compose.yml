# Local PoC (16 GB laptop): AutoEDA + Ollama + a small Spark standalone cluster.
#
#   docker compose up -d --build
#   docker compose exec ollama ollama pull qwen3.5:2b
#
#   UI            http://localhost:8000   (choose engine "Local (DuckDB)" or "Spark cluster")
#   Spark master  http://localhost:8080   worker UI http://localhost:8081
#
# Memory budget (~10 GB): autoeda 5g, spark worker 3g, ollama ~3g with a 2B model.
# Docker Desktop on Windows/WSL2 defaults to half of the RAM; raise it in %UserProfile%\.wslconfig:
#   [wsl2]
#   memory=12GB
# Without Spark:  docker compose up -d autoeda ollama   (and pick the local engine)
# Ollama already on the host? Remove the `ollama` service and set OLLAMA_HOST=http://host.docker.internal:11434

name: autoeda   # fixed project name: same container / volume names wherever it is deployed

x-autoeda-image: &image
  image: autoeda:poc
  build:
    context: .
    args:
      WITH_SPARK: "1"
      WITH_OCR: "1"
      WITH_DOCLING: "1"

x-shared-volumes: &volumes
  # Driver and executors must see the same paths: uploads, intermediate Parquet, input files.
  - ./data:/data
  - ./input:/input:ro
  - ./memory:/memory                # learned skills (a git-tracked folder)

services:
  autoeda:
    <<: *image
    hostname: autoeda            # executors connect back to the driver by this name
    command: ["web"]
    ports: ["8000:8000"]
    environment:
      AUTOEDA_ENGINE: local                       # default in the UI; Spark selectable per job
      AUTOEDA_ADMIN_PASSWORD: ${AUTOEDA_ADMIN_PASSWORD:-}   # first sign-in; unset = random, printed in the log
      AUTOEDA_MEMORY_DIR: /memory
      AUTOEDA_MEMORY_LIMIT: 3GB                   # DuckDB working memory; spills to /data beyond
      AUTOEDA_THREADS: "4"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b}   # laptop-sized; the production servers use qwen3.5:35b-a3b
      # Thinking models: 0 = send think=false, use only the final answer (faster, shorter). 1 = let
      # the model reason first (slower, more tokens). Also on Settings -> Let the model reason.
      AUTOEDA_LLM_REASONING: ${AUTOEDA_LLM_REASONING:-0}
      # Threads per inference call (Ollama model option num_thread; OLLAMA_NUM_THREADS is ignored by
      # current llama-server). 0 or unset = automatic. On a 72-core host use one socket's cores.
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-0}
      AUTOEDA_SPARK_MASTER: spark://spark-master:7077
      AUTOEDA_SPARK_WORK_DIR: file:///data/spark_work
      AUTOEDA_SPARK_CONF: >-
        spark.driver.host=autoeda;spark.driver.bindAddress=0.0.0.0;
        spark.driver.port=7078;spark.blockManager.port=7079;
        spark.executor.memory=2g;spark.executor.cores=2;spark.cores.max=2;
        spark.sql.shuffle.partitions=8;spark.default.parallelism=8
    volumes: *volumes
    mem_limit: 5g
    depends_on: [ollama, spark-master]
    restart: unless-stopped

  spark-master:
    <<: *image
    command: ["spark-master"]
    ports: ["8080:8080"]
    environment:
      SPARK_DAEMON_MEMORY: 512m
    mem_limit: 1g
    restart: unless-stopped

  spark-worker:
    <<: *image
    command: ["spark-worker"]
    ports: ["8081:8081"]
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
      SPARK_DAEMON_MEMORY: 512m
      SPARK_WORKER_DIR: /tmp/spark-worker
    volumes: *volumes
    mem_limit: 3g
    depends_on: [spark-master]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest   # pin a tag for reproducible deployments
    # CPU-only inference: bound the threads (see docker-compose.prod.yml for the long explanation).
    # This file also ends up on 72-core production hosts now and then; there the laptop values make a
    # 35B model load at a crawl. Both are overridable without editing the file:
    #   OLLAMA_NUM_THREADS=12 OLLAMA_CPUSET= docker compose up -d ollama
    # (empty OLLAMA_CPUSET = no limit; cpuset also needs cgroup v2 - see the prod file).
    cpuset: "${OLLAMA_CPUSET-0-7}"
    environment:
      # Only a default for direct `ollama run`: current Ollama ignores it for inference threads.
      # The app limits threads per request with OLLAMA_NUM_THREAD (see the autoeda service).
      OLLAMA_NUM_THREADS: "${OLLAMA_NUM_THREADS:-4}"
      # A 35B model on CPU needs minutes to load: do not abort it with a client timeout.
      OLLAMA_LOAD_TIMEOUT: "${OLLAMA_LOAD_TIMEOUT:-15m}"
      OLLAMA_NO_CLOUD: "1"            # no ollama.com lookups (air-gapped / offline installs)
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
    # fixed name: the offline installer creates it and preloads the models into it, so it is external
    name: autoeda_ollama
    external: true
