{% extends "layout.html" %}
{% block navextra %}<div class="navbar-item"><button class="button is-small is-link" onclick="tourStart()">❓&nbsp;<span data-t="help"></span></button></div>{% endblock %}
{% block content %}
  <div class="steps3">
    <div class="st on" id="s1"><i>1</i><span data-t="step1"></span></div>
    <div class="st" id="s2"><i>2</i><span data-t="step2"></span></div>
    <div class="st" id="s3"><i>3</i><span data-t="step3"></span></div>
  </div>

  <section class="box" id="t-upload">
    <div id="drop" onclick="document.getElementById('file').click()">
      <div class="icon-big">📁</div>
      <div><b data-t="drop_title"></b></div>
      <div class="sub" data-t="drop_sub"></div>
      <div class="sub mt-2" data-t="formats"></div>
      <input type="file" id="file" hidden onchange="choose(this.files[0])">
    </div>
    <div class="notification is-link is-light mt-4 mb-0" id="chosen" hidden>
      <button class="delete" onclick="clearFile()" aria-label="✕"></button>
      📄 <b id="chosen-name"></b> <span class="sub" id="chosen-size"></span>
    </div>

    <label class="ai-opt" id="t-ai"><input type="checkbox" id="useLlm" checked>
      <span><b data-t="ai_opt"></b><br><span class="sub" data-t="ai_opt_sub"></span><br><span class="sub" id="ai-state"></span></span></label>

    <div class="has-text-centered mt-5" id="t-go"><button class="button is-link is-medium" id="goBtn" onclick="analyze()" disabled>▶&nbsp;<span data-t="analyze"></span></button>
      <p class="sub mt-2" data-t="go_hint"></p></div>
    <div class="mt-4" id="upbar" hidden><p class="sub" id="uptext"></p><progress class="progress is-link" id="upfill" value="0" max="100"></progress></div>

    <details class="mt-4"><summary class="sub" style="cursor:pointer" data-t="advanced"></summary>
      <p class="sub mt-2" data-t="adv_hint"></p>
      <div class="columns is-multiline mt-1">
        <div class="column is-4"><label class="label is-small" data-t="engine"></label>
          <div class="select is-fullwidth"><select id="engine"><option value="local" data-t="engine_local"></option><option value="spark" data-t="engine_spark"></option></select></div></div>
        <div class="column is-4"><label class="label is-small" data-t="model"></label><div class="select is-fullwidth"><select id="model"></select></div></div>
        <div class="column is-4"><label class="label is-small" data-t="row_limit"></label><input class="input" type="number" id="maxRows" value="0" min="0" step="100000"></div>
      </div>
      <label class="label is-small mb-0" data-t="server_file"></label><p class="sub" data-t="server_hint"></p>
      <div class="field has-addons mt-2">
        <div class="control is-expanded"><input class="input" type="text" id="path" list="inputFiles"><datalist id="inputFiles"></datalist></div>
        <div class="control" id="hdfs-btn" hidden><button class="button" onclick="hdfsOpen()">🐘&nbsp;<span data-t="hdfs_browse"></span></button></div>
        <div class="control"><button class="button is-link" onclick="fromPath()" data-t="analyze"></button></div>
      </div>
      <p class="sub" data-t="hdfs_hint"></p>
      <p class="sub" id="inputDir"></p>
      <p class="sub mt-2" id="sysstate"></p>
    </details>
  </section>

  <section class="box" id="t-jobs">
    <div class="is-flex is-justify-content-space-between is-align-items-center mb-3">
      <h2 class="title is-5 mb-0" data-t="my_reports"></h2>
      <a class="button is-small" href="/files">🗂&nbsp;<span data-t="manage_files"></span></a>
    </div>
    <div id="jobs"><p class="sub" data-t="no_jobs"></p></div>
  </section>

<div class="modal" id="hdfs">
  <div class="modal-background" onclick="hdfsClose()"></div>
  <div class="modal-card" style="width:min(760px, calc(100vw - 32px))">
    <header class="modal-card-head"><p class="modal-card-title">🐘 HDFS</p><button class="delete" onclick="hdfsClose()" aria-label="close"></button></header>
    <section class="modal-card-body">
      <nav class="breadcrumb mb-3" id="hdfs-crumbs"><ul></ul></nav>
      <table class="table is-fullwidth is-hoverable is-narrow"><tbody id="hdfs-rows"></tbody></table>
      <p class="sub" id="hdfs-msg"></p>
    </section>
  </div>
</div>

<div id="tour-back"><div id="tour-spot"></div><div id="tour-card"><h3 id="tour-title"></h3><div id="tour-text"></div>
  <div class="row"><span class="sub" id="tour-dots"></span><span class="buttons mb-0"><button class="button is-small" id="tour-prev"></button><button class="button is-small is-link" id="tour-next"></button></span></div></div></div>
{% endblock %}

var FILE = null, AI_OK = false, step = 0;

function onLang() {
  $('ai-state').textContent = AI_OK ? '● ' + t('ai_on') : '○ ' + t('ai_off');
  document.title = t('app_title');
  if (FILE) $('chosen-size').textContent = bytes(FILE.size);
  refresh(true);
  if ($('tour-back').style.display === 'block') showStep();
}

var drop = $('drop');
['dragenter', 'dragover'].forEach(function (e) { drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.add('over'); }); });
['dragleave', 'drop'].forEach(function (e) { drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.remove('over'); }); });
drop.addEventListener('drop', function (ev) { if (ev.dataTransfer.files[0]) choose(ev.dataTransfer.files[0]); });

function setStep(n) { [1, 2, 3].forEach(function (i) { $('s' + i).classList.toggle('on', i === n); }); }
function choose(f) {
  if (!f) return; FILE = f;
  $('chosen-name').textContent = f.name; $('chosen-size').textContent = bytes(f.size);
  $('chosen').hidden = false; drop.hidden = true; $('goBtn').disabled = false; setStep(2);
}
function clearFile() { FILE = null; $('file').value = ''; $('chosen').hidden = true; drop.hidden = false; $('goBtn').disabled = true; setStep(1); }
function opts() { return { engine: $('engine').value, use_llm: $('useLlm').checked && AI_OK, model: $('model').value, max_rows: parseInt($('maxRows').value || '0', 10), lang: LANG }; }

function analyze() {
  if (!FILE) return;
  var o = opts(), q = new URLSearchParams({ filename: FILE.name, engine: o.engine, use_llm: o.use_llm, model: o.model, max_rows: o.max_rows, lang: o.lang });
  var xhr = new XMLHttpRequest(); xhr.open('PUT', '/api/upload?' + q.toString());
  $('upbar').hidden = false; $('goBtn').disabled = true; $('goBtn').classList.add('is-loading');
  xhr.upload.onprogress = function (e) { if (!e.lengthComputable) return; var p = e.loaded / e.total;
    $('upfill').value = (100 * p).toFixed(1); $('uptext').textContent = t('uploading', { p: Math.round(100 * p) + '%' }); };
  xhr.onload = function () { $('upbar').hidden = true; $('goBtn').classList.remove('is-loading');
    if (xhr.status === 401) { location.href = '/login?next=/'; return; }
    if (xhr.status >= 300) { toast(t('err_upload'), 'bad'); $('goBtn').disabled = false; return; }
    clearFile(); setStep(3); refresh(true); $('t-jobs').scrollIntoView({ behavior: 'smooth' }); };
  xhr.onerror = function () { $('upbar').hidden = true; $('goBtn').disabled = false; $('goBtn').classList.remove('is-loading'); toast(t('err_upload'), 'bad'); };
  xhr.send(FILE);
}
function fromPath() {
  var path = $('path').value.trim(); if (!path) return;
  var o = opts(); o.path = path;
  fetch('/api/path', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) toast(j.detail || t('err_generic'), 'bad'); else { setStep(3); refresh(true); } }); })
    .catch(function () { toast(t('err_generic'), 'bad'); });
}
function stage(j) {
  if (j.status === 'queued') return t('stage_queue');
  if (j.status === 'cancelling') return t('stage_stopping');
  var p = j.progress || 0;
  return p < 0.1 ? t('stage_read') : p < 0.5 ? t('stage_fix') : p < 0.9 ? t('stage_cols') : p < 0.99 ? t('stage_ai') : t('stage_report');
}
function friendlyError(m) {
  m = String(m || '').toLowerCase();
  if (m.indexOf('password') >= 0 || m.indexOf('encrypt') >= 0) return t('err_pwd');
  if (m.indexOf('scanned') >= 0 || m.indexOf('no extractable text') >= 0) return t('err_scan');
  if (m.indexOf('unsupported') >= 0) return t('err_fmt');
  if (m.indexOf('empty') >= 0) return t('err_empty');
  return t('err_generic');
}
function dur(s) { s = Math.round(s || 0); return s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + (s % 60) + ' s'; }
function jobAction(id, action, okMsg) {
  return fetch('/api/jobs/' + id + (action === 'delete' ? '' : '/' + action), { method: action === 'delete' ? 'DELETE' : 'POST' })
    .then(function (r) {
      if (r.ok) { if (okMsg) toast(okMsg, 'good'); return refresh(true); }
      toast(r.status === 410 ? t('err_gone') : t('err_action'), 'bad'); refresh(true);
    }).catch(function () { toast(t('err_action'), 'bad'); });
}
function dropFile(id, size) {
  ask(t('confirm_drop_t'), t('confirm_drop', { size: bytes(size) || '' }), t('drop_yes'), true)
    .then(function (ok) { if (ok) jobAction(id, 'drop-file', t('toast_dropped')); });
}
function delJob(id) { ask(t('confirm_del_t'), t('confirm_del'), t('del_yes'), true).then(function (ok) { if (ok) jobAction(id, 'delete'); }); }
function stopJob(id) { ask(t('confirm_stop_t'), t('confirm_stop'), t('stop_yes'), true).then(function (ok) { if (ok) jobAction(id, 'cancel', t('toast_stopped')); }); }
function restartJob(id, running, done) {
  if (done) return ask(t('confirm_rerun_t'), t('confirm_rerun'), t('rerun_yes')).then(function (ok) { if (ok) jobAction(id, 'restart', t('toast_restarted')); });
  if (!running) return jobAction(id, 'restart', t('toast_restarted'));
  ask(t('confirm_restart_t'), t('confirm_restart'), t('restart_yes')).then(function (ok) { if (ok) jobAction(id, 'restart', t('toast_restarted')); });
}
var CHIP = { done: 'is-success', failed: 'is-danger', running: 'is-link', queued: 'is-link', cancelling: '', cancelled: '' };

var busy = false;
function refresh(force) {
  if (busy && !force) return; busy = true;
  return fetch('/api/jobs').then(function (r) { return r.json(); }).then(function (jobs) {
    busy = false;
    if (!jobs.length) { $('jobs').innerHTML = '<p class="sub">' + esc(t('no_jobs')) + '</p>'; return; }
    $('jobs').innerHTML = jobs.map(function (j) {
      var pct = Math.round((j.progress || 0) * 100), body = '', id = "'" + j.id + "'";
      var running = j.status === 'queued' || j.status === 'running';
      var again = (j.can_restart ? '<button class="button is-small" onclick="restartJob(' + id + ', false, ' + (j.status === 'done') + ')">↻&nbsp;' +
        esc(t(j.status === 'done' ? 'run_again' : 'retry')) + '</button>' : '') +
        (j.stored && !running && j.status !== 'cancelling' ? '<button class="button is-small" onclick="dropFile(' + id + ', ' + (j.size || 0) + ')">🗑&nbsp;' +
        esc(t('drop_file')) + '</button>' : '') +
        (j.file_deleted ? '<span class="sub">' + esc(t('file_deleted')) + '</span>' : '');
      if (j.status === 'done') {
        var rows = 0, cols = 0; (j.tables || []).forEach(function (x) { rows += x.rows; cols += x.cols; });
        body = '<div class="sub">' + esc(t('tables', { n: (j.tables || []).length, rows: num(rows), cols: num(cols) })) + ' · ' + esc(t('took', { s: dur(j.elapsed_s) })) + '</div>' +
          '<div class="buttons"><a class="button is-link is-small" href="/reports/' + j.id + '" target="_blank">📖&nbsp;' + esc(t('open')) + '</a>' +
          '<a class="button is-small" href="/reports/' + j.id + '?download=1">⬇&nbsp;' + esc(t('download')) + '</a>' +
          '<a class="button is-small" href="/reports/' + j.id + '#print" target="_blank">🖨&nbsp;' + esc(t('pdf')) + '</a>' + again + '</div>';
      } else if (j.status === 'failed') {
        body = '<p class="has-text-danger mt-1">' + esc(friendlyError(j.message)) + '</p><details class="sub"><summary>' + esc(t('details')) + '</summary>' + esc(j.message) + '</details>' +
          (again ? '<div class="buttons">' + again + '</div>' : '');
      } else if (j.status === 'cancelled') {
        body = '<p class="sub mt-1">' + esc(t('stopped_msg')) + '</p>' + (again ? '<div class="buttons">' + again + '</div>' : '');
      } else {
        body = '<div class="stage">' + esc(stage(j)) + ' <b>' + pct + '%</b></div><progress class="progress is-small ' + (j.status === 'cancelling' ? 'stopping' : 'is-link') +
          '" value="' + pct + '" max="100"></progress>' +
          (running ? '<div class="buttons"><button class="button is-small is-danger is-outlined" onclick="stopJob(' + id + ')">■&nbsp;' + esc(t('stop')) + '</button>' +
            (j.can_restart ? '<button class="button is-small" onclick="restartJob(' + id + ', true)">↻&nbsp;' + esc(t('restart')) + '</button>' : '') + '</div>' : '');
      }
      var owner = IS_ADMIN && j.owner && ME && j.owner !== ME.name ? ' <span class="tag is-light is-info">' + esc(t('by', { u: j.owner })) + '</span>' : '';
      return '<div class="job"><div class="top"><span style="font-size:22px">📄</span><span class="fname">' + esc(j.file) + '</span>' + owner +
        '<span class="sub">' + esc(bytes(j.size)) + '</span><span class="tag ' + (CHIP[j.status] ? CHIP[j.status] + ' is-light' : 'is-plain') + '">' + esc(t('st_' + j.status)) + '</span>' +
        (['done', 'failed', 'cancelled'].indexOf(j.status) >= 0 ? '<button class="delete" title="' + esc(t('del')) + '" aria-label="' + esc(t('del')) + '" onclick="delJob(' + id + ')"></button>' : '') +
        '</div>' + body + '</div>';
    }).join('');
  }).catch(function () { busy = false; });
}

// --- HDFS browser (WebHDFS through the app) -------------------------------------------------
function hdfsOpen(path) { $('hdfs').classList.add('is-active'); hdfsGo(path || store('autoeda-hdfs-dir') || '/'); }
function hdfsClose() { $('hdfs').classList.remove('is-active'); }
function hdfsGo(path) {
  $('hdfs-msg').textContent = ''; $('hdfs-rows').innerHTML = '<tr><td><progress class="progress is-small"></progress></td></tr>';
  fetch('/api/hdfs?path=' + encodeURIComponent(path)).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw j; return j; }); })
    .then(function (j) {
      store('autoeda-hdfs-dir', j.path);
      var parts = j.path.split('/').filter(Boolean), acc = '';
      $('hdfs-crumbs').firstElementChild.innerHTML = '<li><a href="#" data-p="/">/</a></li>' + parts.map(function (p) {
        acc += '/' + p; return '<li><a href="#" data-p="' + esc(acc) + '">' + esc(p) + '</a></li>'; }).join('');
      $('hdfs-crumbs').querySelectorAll('a').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); hdfsGo(a.dataset.p); }; });
      $('hdfs-rows').innerHTML = j.entries.map(function (e, i) {
        return '<tr style="cursor:pointer" data-i="' + i + '"><td>' + (e.dir ? '📁 ' : '📄 ') + '<b>' + esc(e.name) + '</b></td><td class="has-text-right sub">' +
          (e.dir ? '' : esc(bytes(e.size))) + '</td><td class="sub">' + esc(when(e.modified)) + '</td></tr>';
      }).join('');
      $('hdfs-rows').querySelectorAll('tr').forEach(function (tr) {
        var e = j.entries[tr.dataset.i];
        tr.onclick = function () {
          if (e.dir) return hdfsGo(e.path);
          $('path').value = e.uri; hdfsClose(); toast(t('hdfs_pick', { p: e.uri }), 'good');
        };
      });
      if (!j.entries.length) $('hdfs-msg').textContent = t('hdfs_empty');
    })
    .catch(function (e) { $('hdfs-rows').innerHTML = ''; $('hdfs-msg').textContent = t('hdfs_err') + ((e && e.detail) || ''); });
}

function target(sel) { return document.querySelector(sel); }
function showStep() {
  var steps = tr('tour'), s = steps[step], el = target(s[0]);
  if (el.offsetParent === null) el = $('t-upload');            // e.g. the language buttons inside a closed mobile menu
  $('tour-title').textContent = s[1]; $('tour-text').textContent = s[2];
  $('tour-dots').textContent = (step + 1) + ' / ' + steps.length;
  $('tour-prev').textContent = t('prev'); $('tour-prev').style.visibility = step ? 'visible' : 'hidden';
  $('tour-next').textContent = step === steps.length - 1 ? t('done') : t('next');
  el.scrollIntoView({ block: 'center' });
  setTimeout(function () {
    var r = el.getBoundingClientRect(), pad = 8, spot = $('tour-spot'), card = $('tour-card');
    spot.style.left = (r.left - pad) + 'px'; spot.style.top = (r.top - pad) + 'px';
    spot.style.width = (r.width + 2 * pad) + 'px'; spot.style.height = (Math.min(r.height, innerHeight * 0.6) + 2 * pad) + 'px';
    var ch = card.offsetHeight, cw = card.offsetWidth, h = Math.min(r.height, innerHeight * 0.6);
    card.style.top = (r.top + h + 20 + ch < innerHeight ? r.top + h + 20 : Math.max(12, r.top - ch - 20)) + 'px';
    card.style.left = Math.min(Math.max(12, r.left), innerWidth - cw - 12) + 'px';
  }, 60);
}
function tourStart() { step = 0; $('tour-back').style.display = 'block'; showStep(); }
function tourEnd() { $('tour-back').style.display = 'none'; store('autoeda-app-tour', '1'); }
$('tour-next').onclick = function () { if (step < tr('tour').length - 1) { step++; showStep(); } else tourEnd(); };
$('tour-prev').onclick = function () { if (step > 0) { step--; showStep(); } };
$('tour-back').addEventListener('click', function (e) { if (e.target.id === 'tour-back') tourEnd(); });
document.addEventListener('keydown', function (e) { if (!dlgDone && e.key === 'Escape') tourEnd(); });
addEventListener('resize', function () { if ($('tour-back').style.display === 'block') showStep(); });

boot();
fetch('/api/config').then(function (r) { return r.json(); }).then(function (c) {
  $('engine').value = c.engine;
  $('hdfs-btn').hidden = !c.hdfs;
  if (!c.spark_available) $('engine').querySelector('[value=spark]').disabled = true;
  var models = c.models.length ? c.models : [c.default_model];
  $('model').innerHTML = models.map(function (m) { return '<option' + (m === c.default_model ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('');
  AI_OK = c.models.length > 0; $('useLlm').checked = AI_OK && c.ai_default_on !== false; $('useLlm').disabled = !AI_OK;
  $('sysstate').innerHTML = '<span class="dot ok"></span>' + esc(t('sys_ok')) + ' · ' + esc(t('sys_engine')) + ': ' + esc(c.engine) +
    ' · DuckDB ' + esc(c.memory_limit) + ' · AI: <span class="dot ' + (AI_OK ? 'ok' : 'no') + '"></span>' + esc(c.default_model);
  $('ai-state').textContent = AI_OK ? '● ' + t('ai_on') : '○ ' + t('ai_off');
}).catch(function () {});
fetch('/api/input-files').then(function (r) { return r.json(); }).then(function (r) {
  $('inputDir').textContent = r.dir + ' (' + r.files.length + ')';
  $('inputFiles').innerHTML = r.files.map(function (f) { return '<option value="' + esc(f.path) + '">' + esc(bytes(f.size)) + '</option>'; }).join('');
}).catch(function () {});
setInterval(refresh, 2000);
if (!store('autoeda-app-tour')) setTimeout(tourStart, 700);
</script>
{% endblock %}
