<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Check</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #fff; --ink: #1c2330; --muted: #5b6475; --line: #e2e5eb;
  --accent: #2563d9; --accent-soft: #e8effc; --good: #15803d; --good-soft: #e5f5ea;
  --bad: #c2410c; --bad-soft: #fde8df; --ai: #7c3aed; --ai-soft: #f1eafe;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12151b; --panel: #1a1f27; --ink: #e7eaf0; --muted: #9aa3b3; --line: #2c333e;
    --accent: #7aa7ff; --accent-soft: #1d2a44; --good: #5fcf88; --good-soft: #15301f;
    --bad: #fb8f63; --bad-soft: #3d1f14; --ai: #b794f6; --ai-soft: #2a2140; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { max-width: 920px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { flex: 1; min-width: 200px; }
.brand b { font-size: 20px; } .brand span { display: block; color: var(--muted); font-size: 14px; }
main { max-width: 920px; margin: 0 auto; padding: 22px 16px 70px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 16px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 15px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.big { font-size: 18px; padding: 12px 30px; font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 8px 13px; cursor: pointer; font: inherit; font-size: 15px; }
.seg button.on { background: var(--accent); color: #fff; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-bottom: 18px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
.step { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 15px; }
.step i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; }
.step.on { color: var(--ink); font-weight: 600; } .step.on i { background: var(--accent); color: #fff; }
#drop { border: 2px dashed var(--line); border-radius: 16px; padding: 40px 16px; text-align: center; cursor: pointer; transition: .15s; }
#drop:hover, #drop.over { border-color: var(--accent); background: var(--accent-soft); }
#drop .icon { font-size: 44px; line-height: 1; }
#drop b { color: var(--accent); font-size: 19px; }
.sub { color: var(--muted); font-size: 14px; }
#chosen { display: none; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; margin-top: 14px; }
#chosen .name { flex: 1; font-weight: 600; word-break: break-all; }
.opt { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--ai-soft); }
.opt input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--ai); }
.go { text-align: center; margin-top: 18px; }
details.adv { margin-top: 16px; }
details.adv summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
select, input[type=text], input[type=number] { padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font: inherit; font-size: 15px; width: 100%; }
.uploadbar { display: none; margin-top: 14px; }
.track { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.track i { display: block; height: 10px; background: var(--accent); width: 0; transition: width .4s; }
.job { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
.job .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.job .fname { flex: 1; font-weight: 600; word-break: break-all; min-width: 160px; }
.chip { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.chip.done { background: var(--good-soft); color: var(--good); }
.chip.failed { background: var(--bad-soft); color: var(--bad); }
.chip.running, .chip.queued { background: var(--accent-soft); color: var(--accent); }
.chip.cancelling, .chip.cancelled { background: var(--line); color: var(--muted); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); }
.btn.primary.danger { background: var(--bad); color: #fff; }
.btn.sm { padding: 5px 13px; font-size: 14px; }
.track.stopping i { background: var(--muted); }
#dlg-back { position: fixed; inset: 0; z-index: 95; background: rgba(10, 14, 22, .55); display: none; align-items: center; justify-content: center; padding: 16px; }
#dlg-back.open { display: flex; }
#dlg { width: min(420px, 100%); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
#dlg h3 { margin: 0 0 8px; font-size: 18px; }
#dlg p { margin: 0; color: var(--muted); }
#dlg .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
#toasts { position: fixed; z-index: 96; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; width: min(460px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 12px 14px; box-shadow: 0 8px 28px rgba(0,0,0,.18); animation: toastin .2s ease-out; }
.toast.bad { border-left-color: var(--bad); } .toast.good { border-left-color: var(--good); }
.toast span { flex: 1; } .toast .x { font-size: 16px; padding: 0; }
@keyframes toastin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.job .stage { margin: 8px 0 6px; font-size: 15px; }
.job .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; }
.err { color: var(--bad); margin-top: 6px; }
.status { font-size: 13px; color: var(--muted); margin-top: 6px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.dot.ok { background: var(--good); } .dot.no { background: var(--bad); }
[hidden] { display: none !important; }
#tour-back { position: fixed; inset: 0; z-index: 90; display: none; }
#tour-spot { position: fixed; z-index: 91; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(10, 14, 22, .62); transition: all .25s; pointer-events: none; }
#tour-card { position: fixed; z-index: 92; width: min(380px, calc(100vw - 32px)); background: var(--panel); border-radius: 14px; padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.3); transition: top .25s, left .25s; }
#tour-card h3 { margin: 0 0 6px; }
#tour-card .row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
@media (max-width: 640px) { .steps { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><b>📊 <span data-t="app_title" style="display:inline;color:inherit;font-size:inherit"></span></b><span data-t="app_sub"></span></div>
  <div class="seg" id="langbox"><button data-setlang="en">English</button><button data-setlang="id">Indonesia</button></div>
  <button class="btn primary" onclick="tourStart()">❓ <span data-t="help"></span></button>
</div></header>

<main>
  <div class="steps">
    <div class="step on" id="s1"><i>1</i><span data-t="step1"></span></div>
    <div class="step" id="s2"><i>2</i><span data-t="step2"></span></div>
    <div class="step" id="s3"><i>3</i><span data-t="step3"></span></div>
  </div>

  <section class="card" id="t-upload">
    <div id="drop" onclick="document.getElementById('file').click()">
      <div class="icon">📁</div>
      <div><b data-t="drop_title"></b></div>
      <div class="sub" data-t="drop_sub"></div>
      <div class="sub" style="margin-top:8px" data-t="formats"></div>
      <input type="file" id="file" hidden onchange="choose(this.files[0])">
    </div>
    <div id="chosen"><span style="font-size:26px">📄</span><span class="name" id="chosen-name"></span><span class="sub" id="chosen-size"></span>
      <button class="x" title="✕" onclick="clearFile()">✕</button></div>

    <label class="opt" id="t-ai"><input type="checkbox" id="useLlm" checked>
      <span><b data-t="ai_opt"></b><br><span class="sub" data-t="ai_opt_sub"></span><br><span class="sub" id="ai-state"></span></span></label>

    <div class="go" id="t-go"><button class="btn primary big" id="goBtn" onclick="analyze()" disabled>▶ <span data-t="analyze"></span></button>
      <div class="sub" style="margin-top:6px" data-t="go_hint"></div></div>
    <div class="uploadbar" id="upbar"><div class="sub" id="uptext"></div><div class="track"><i id="upfill"></i></div></div>

    <details class="adv"><summary data-t="advanced"></summary>
      <p class="sub" data-t="adv_hint"></p>
      <div class="grid">
        <label class="f"><span data-t="engine"></span>
          <select id="engine"><option value="local" data-t="engine_local"></option><option value="spark" data-t="engine_spark"></option></select></label>
        <label class="f"><span data-t="model"></span><select id="model"></select></label>
        <label class="f"><span data-t="row_limit"></span><input type="number" id="maxRows" value="0" min="0" step="100000"></label>
      </div>
      <div style="margin-top:14px"><b data-t="server_file"></b><div class="sub" data-t="server_hint"></div>
        <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">
          <input type="text" id="path" list="inputFiles" style="flex:1;min-width:200px"><datalist id="inputFiles"></datalist>
          <button class="btn" onclick="fromPath()" data-t="analyze"></button></div>
        <div class="sub" id="inputDir"></div></div>
      <div class="status" id="sysstate"></div>
    </details>
  </section>

  <section class="card" id="t-jobs">
    <h2 style="margin:0 0 12px;font-size:20px" data-t="my_reports"></h2>
    <div id="jobs"><p class="sub" data-t="no_jobs"></p></div>
  </section>
</main>

<div id="dlg-back" role="presentation"><div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-text">
  <h3 id="dlg-title"></h3><p id="dlg-text"></p>
  <div class="row"><button class="btn" id="dlg-no"></button><button class="btn primary" id="dlg-yes"></button></div></div></div>
<div id="toasts" aria-live="polite"></div>

<div id="tour-back"><div id="tour-spot"></div><div id="tour-card"><h3 id="tour-title"></h3><div id="tour-text"></div>
  <div class="row"><span class="sub" id="tour-dots"></span><span><button class="btn" id="tour-prev"></button> <button class="btn primary" id="tour-next"></button></span></div></div></div>

<script>
var T = {
 en: {

};
var $ = function (id) { return document.getElementById(id); };
var LANG = 'en', FILE = null, AI_OK = false, step = 0;
function t(k, p) { var s = (T[LANG][k] !== undefined ? T[LANG][k] : T.en[k]) || k; if (p) for (var x in p) s = s.replace('{' + x + '}', p[x]); return s; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(n) { return Number(n).toLocaleString(LANG === 'id' ? 'id-ID' : 'en-US'); }
function bytes(n) { if (n == null) return ''; var u = ['B','KB','MB','GB','TB'], i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return n.toLocaleString(LANG === 'id' ? 'id-ID' : 'en-US', {maximumFractionDigits: i ? 1 : 0}) + ' ' + u[i]; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

function setLang(l) {
  LANG = l; document.documentElement.lang = l; store('autoeda-lang', l);
  document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-setlang]').forEach(function (b) { b.classList.toggle('on', b.dataset.setlang === l); });
  $('ai-state').textContent = AI_OK ? '● ' + t('ai_on') : '○ ' + t('ai_off');
  document.title = t('app_title');
  if (FILE) $('chosen-size').textContent = bytes(FILE.size);
  refresh();
  if ($('tour-back').style.display === 'block') showStep();
}
document.querySelectorAll('[data-setlang]').forEach(function (b) { b.onclick = function () { setLang(b.dataset.setlang); }; });

var drop = $('drop');
['dragenter', 'dragover'].forEach(function (e) { drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.add('over'); }); });
['dragleave', 'drop'].forEach(function (e) { drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.remove('over'); }); });
drop.addEventListener('drop', function (ev) { if (ev.dataTransfer.files[0]) choose(ev.dataTransfer.files[0]); });

function setStep(n) { [1, 2, 3].forEach(function (i) { $('s' + i).classList.toggle('on', i === n); }); }
function choose(f) {
  if (!f) return; FILE = f;
  $('chosen-name').textContent = f.name; $('chosen-size').textContent = bytes(f.size);
  $('chosen').style.display = 'flex'; drop.style.display = 'none'; $('goBtn').disabled = false; setStep(2);
}
function clearFile() { FILE = null; $('file').value = ''; $('chosen').style.display = 'none'; drop.style.display = ''; $('goBtn').disabled = true; setStep(1); }
function opts() { return { engine: $('engine').value, use_llm: $('useLlm').checked && AI_OK, model: $('model').value, max_rows: parseInt($('maxRows').value || '0', 10), lang: LANG }; }

function analyze() {
  if (!FILE) return;
  var o = opts(), q = new URLSearchParams({ filename: FILE.name, engine: o.engine, use_llm: o.use_llm, model: o.model, max_rows: o.max_rows, lang: o.lang });
  var xhr = new XMLHttpRequest(); xhr.open('PUT', '/api/upload?' + q.toString());
  $('upbar').style.display = 'block'; $('goBtn').disabled = true;
  xhr.upload.onprogress = function (e) { if (!e.lengthComputable) return; var p = e.loaded / e.total;
    $('upfill').style.width = (100 * p).toFixed(1) + '%'; $('uptext').textContent = t('uploading', { p: Math.round(100 * p) + '%' }); };
  xhr.onload = function () { $('upbar').style.display = 'none';
    if (xhr.status >= 300) { toast(t('err_upload'), 'bad'); $('goBtn').disabled = false; return; }
    clearFile(); setStep(3); refresh(); $('t-jobs').scrollIntoView({ behavior: 'smooth' }); };
  xhr.onerror = function () { $('upbar').style.display = 'none'; $('goBtn').disabled = false; toast(t('err_upload'), 'bad'); };
  xhr.send(FILE);
}
function fromPath() {
  var path = $('path').value.trim(); if (!path) return;
  var o = opts(); o.path = path;
  fetch('/api/path', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) toast(j.detail || t('err_generic'), 'bad'); else { setStep(3); refresh(); } }); })
    .catch(function () { toast(t('err_generic'), 'bad'); });
}
function stage(j) {
  if (j.status === 'queued') return t('stage_queue');
  if (j.status === 'cancelling') return t('stage_stopping');
  var p = j.progress || 0;
  return p < 0.1 ? t('stage_read') : p < 0.5 ? t('stage_fix') : p < 0.9 ? t('stage_cols') : p < 0.99 ? t('stage_ai') : t('stage_report');
}
function friendlyError(m) {
  m = String(m || '').toLowerCase();
  if (m.indexOf('password') >= 0 || m.indexOf('encrypt') >= 0) return t('err_pwd');
  if (m.indexOf('scanned') >= 0 || m.indexOf('no extractable text') >= 0) return t('err_scan');
  if (m.indexOf('unsupported') >= 0) return t('err_fmt');
  if (m.indexOf('empty') >= 0) return t('err_empty');
  return t('err_generic');
}
function dur(s) { s = Math.round(s || 0); return s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + (s % 60) + ' s'; }
// --- in-page dialog and notices (instead of the browser's alert / confirm) ---------------
var dlgDone = null, dlgFocus = null;
function ask(title, text, yes, danger) {
  return new Promise(function (resolve) {
    dlgFocus = document.activeElement;
    $('dlg-title').textContent = title; $('dlg-text').textContent = text;
    $('dlg-yes').textContent = yes; $('dlg-no').textContent = t('cancel');
    $('dlg-yes').classList.toggle('danger', !!danger);
    $('dlg-back').classList.add('open');
    dlgDone = function (v) { $('dlg-back').classList.remove('open'); dlgDone = null; if (dlgFocus) dlgFocus.focus(); resolve(v); };
    $('dlg-no').focus();
  });
}
$('dlg-yes').onclick = function () { if (dlgDone) dlgDone(true); };
$('dlg-no').onclick = function () { if (dlgDone) dlgDone(false); };
$('dlg-back').addEventListener('click', function (e) { if (e.target.id === 'dlg-back' && dlgDone) dlgDone(false); });
function toast(msg, kind) {
  var el = document.createElement('div');
  el.className = 'toast ' + (kind || ''); el.setAttribute('role', kind === 'bad' ? 'alert' : 'status');
  el.innerHTML = '<span></span><button class="x" aria-label="' + esc(t('ok')) + '">✕</button>';
  el.firstChild.textContent = msg;
  var close = function () { if (el.parentNode) el.parentNode.removeChild(el); };
  el.lastChild.onclick = close;
  $('toasts').appendChild(el);
  setTimeout(close, kind === 'bad' ? 9000 : 4500);
}
function jobAction(id, action, okMsg) {
  return fetch('/api/jobs/' + id + (action === 'delete' ? '' : '/' + action), { method: action === 'delete' ? 'DELETE' : 'POST' })
    .then(function (r) {
      if (r.ok) { if (okMsg) toast(okMsg, 'good'); return refresh(true); }
      toast(r.status === 410 ? t('err_gone') : t('err_action'), 'bad'); refresh(true);
    }).catch(function () { toast(t('err_action'), 'bad'); });
}
function delJob(id) { ask(t('confirm_del_t'), t('confirm_del'), t('del_yes'), true).then(function (ok) { if (ok) jobAction(id, 'delete'); }); }
function stopJob(id) { ask(t('confirm_stop_t'), t('confirm_stop'), t('stop_yes'), true).then(function (ok) { if (ok) jobAction(id, 'cancel', t('toast_stopped')); }); }
function restartJob(id, running) {
  if (!running) return jobAction(id, 'restart', t('toast_restarted'));
  ask(t('confirm_restart_t'), t('confirm_restart'), t('restart_yes')).then(function (ok) { if (ok) jobAction(id, 'restart', t('toast_restarted')); });
}

var busy = false;
function refresh(force) {
  if (busy && !force) return; busy = true;
  fetch('/api/jobs').then(function (r) { return r.json(); }).then(function (jobs) {
    busy = false;
    if (!jobs.length) { $('jobs').innerHTML = '<p class="sub">' + esc(t('no_jobs')) + '</p>'; return; }
    $('jobs').innerHTML = jobs.map(function (j) {
      var pct = Math.round((j.progress || 0) * 100), body = '', id = "'" + j.id + "'";
      var running = j.status === 'queued' || j.status === 'running';
      var again = j.can_restart ? '<button class="btn sm" onclick="restartJob(' + id + ', false)">↻ ' +
        esc(t(j.status === 'done' ? 'run_again' : 'retry')) + '</button>' : '';
      if (j.status === 'done') {
        var rows = 0, cols = 0; (j.tables || []).forEach(function (x) { rows += x.rows; cols += x.cols; });
        body = '<div class="sub">' + esc(t('tables', { n: (j.tables || []).length, rows: num(rows), cols: num(cols) })) + ' · ' + esc(t('took', { s: dur(j.elapsed_s) })) + '</div>' +
          '<div class="actions"><a class="btn primary" href="/reports/' + j.id + '" target="_blank">📖 ' + esc(t('open')) + '</a>' +
          '<a class="btn" href="/reports/' + j.id + '?download=1">⬇ ' + esc(t('download')) + '</a>' + again + '</div>';
      } else if (j.status === 'failed') {
        body = '<div class="err">' + esc(friendlyError(j.message)) + '</div><details class="sub"><summary>' + esc(t('details')) + '</summary>' + esc(j.message) + '</details>' +
          (again ? '<div class="actions">' + again + '</div>' : '');
      } else if (j.status === 'cancelled') {
        body = '<div class="sub" style="margin-top:6px">' + esc(t('stopped_msg')) + '</div>' + (again ? '<div class="actions">' + again + '</div>' : '');
      } else {
        body = '<div class="stage">' + esc(stage(j)) + ' <b>' + pct + '%</b></div><div class="track' + (j.status === 'cancelling' ? ' stopping' : '') +
          '"><i style="width:' + pct + '%"></i></div>' +
          (running ? '<div class="actions"><button class="btn sm danger" onclick="stopJob(' + id + ')">■ ' + esc(t('stop')) + '</button>' +
            (j.can_restart ? '<button class="btn sm" onclick="restartJob(' + id + ', true)">↻ ' + esc(t('restart')) + '</button>' : '') + '</div>' : '');
      }
      return '<div class="job"><div class="top"><span style="font-size:22px">📄</span><span class="fname">' + esc(j.file) + '</span>' +
        '<span class="sub">' + esc(bytes(j.size)) + '</span><span class="chip ' + j.status + '">' + esc(t('st_' + j.status)) + '</span>' +
        (['done', 'failed', 'cancelled'].indexOf(j.status) >= 0 ? '<button class="x" title="' + esc(t('del')) + '" aria-label="' + esc(t('del')) + '" onclick="delJob(' + id + ')">🗑</button>' : '') +
        '</div>' + body + '</div>';
    }).join('');
  }).catch(function () { busy = false; });
}

function target(sel) { return document.querySelector(sel); }
function showStep() {
  var steps = T[LANG].tour, s = steps[step], el = target(s[0]);
  $('tour-title').textContent = s[1]; $('tour-text').textContent = s[2];
  $('tour-dots').textContent = (step + 1) + ' / ' + steps.length;
  $('tour-prev').textContent = t('prev'); $('tour-prev').style.visibility = step ? 'visible' : 'hidden';
  $('tour-next').textContent = step === steps.length - 1 ? t('done') : t('next');
  el.scrollIntoView({ block: 'center' });
  setTimeout(function () {
    var r = el.getBoundingClientRect(), pad = 8, spot = $('tour-spot'), card = $('tour-card');
    spot.style.left = (r.left - pad) + 'px'; spot.style.top = (r.top - pad) + 'px';
    spot.style.width = (r.width + 2 * pad) + 'px'; spot.style.height = (Math.min(r.height, innerHeight * 0.6) + 2 * pad) + 'px';
    var ch = card.offsetHeight, cw = card.offsetWidth, h = Math.min(r.height, innerHeight * 0.6);
    card.style.top = (r.top + h + 20 + ch < innerHeight ? r.top + h + 20 : Math.max(12, r.top - ch - 20)) + 'px';
    card.style.left = Math.min(Math.max(12, r.left), innerWidth - cw - 12) + 'px';
  }, 60);
}
function tourStart() { step = 0; $('tour-back').style.display = 'block'; showStep(); }
function tourEnd() { $('tour-back').style.display = 'none'; store('autoeda-app-tour', '1'); }
$('tour-next').onclick = function () { if (step < T[LANG].tour.length - 1) { step++; showStep(); } else tourEnd(); };
$('tour-prev').onclick = function () { if (step > 0) { step--; showStep(); } };
$('tour-back').addEventListener('click', function (e) { if (e.target.id === 'tour-back') tourEnd(); });
document.addEventListener('keydown', function (e) {
  if (dlgDone) { if (e.key === 'Escape') dlgDone(false); return; }
  if (e.key === 'Escape') tourEnd();
});
addEventListener('resize', function () { if ($('tour-back').style.display === 'block') showStep(); });

(function init() {
  var saved = store('autoeda-lang');
  setLang(saved || ((navigator.language || '').toLowerCase().indexOf('id') === 0 ? 'id' : 'en'));
  fetch('/api/config').then(function (r) { return r.json(); }).then(function (c) {
    $('engine').value = c.engine;
    if (!c.spark_available) $('engine').querySelector('[value=spark]').disabled = true;
    var models = c.models.length ? c.models : [c.default_model];
    $('model').innerHTML = models.map(function (m) { return '<option' + (m === c.default_model ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('');
    AI_OK = c.models.length > 0; $('useLlm').checked = AI_OK; $('useLlm').disabled = !AI_OK;
    $('sysstate').innerHTML = '<span class="dot ok"></span>' + esc(t('sys_ok')) + ' · ' + esc(t('sys_engine')) + ': ' + esc(c.engine) +
      ' · DuckDB ' + esc(c.memory_limit) + ' · AI: <span class="dot ' + (AI_OK ? 'ok' : 'no') + '"></span>' + esc(c.default_model);
    $('ai-state').textContent = AI_OK ? '● ' + t('ai_on') : '○ ' + t('ai_off');
  }).catch(function () {});
  fetch('/api/input-files').then(function (r) { return r.json(); }).then(function (r) {
    $('inputDir').textContent = r.dir + ' (' + r.files.length + ')';
    $('inputFiles').innerHTML = r.files.map(function (f) { return '<option value="' + esc(f.path) + '">' + esc(bytes(f.size)) + '</option>'; }).join('');
  }).catch(function () {});
  setInterval(refresh, 2000);
  if (!store('autoeda-app-tour')) setTimeout(tourStart, 700);
})();
</script>
</body>
